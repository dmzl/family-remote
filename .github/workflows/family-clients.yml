# Generated by scripts/prepare_client_workflow.rb from the pinned upstream workflow.
---
name: Family client baseline builds
'on':
  workflow_dispatch:
    inputs:
      bridge-run-id:
        description: Successful matching family bridge run ID
        required: true
        type: string
      upload-artifact:
        description: Build baseline artifacts
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_WINDOWS_ARM_VERSION: 3.44.9
  FLUTTER_MACOS_ARM_VERSION: 3.44.9
  FLUTTER_ELINUX_VERSION: 3.16.9
  TAG_NAME: family-baseline
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 9e593bb18ea69cc5095e012465dcd675a822ed0d
  VCPKG_CMAKE_VERSION: 4.3.0
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: 1.5.3
  NDK_VERSION: r28c
  ANDROID_SIGNING_KEY: ''
  MACOS_P12_BASE64: ''
  UPLOAD_ARTIFACT: 'true'
  PUBLISH_UPDATE_METADATA: 'false'
  SIGN_BASE_URL: ''
jobs:
  verify-bridge:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Verify successful bridge run and matching source
      env:
        GH_TOKEN: "${{ github.token }}"
        BRIDGE_RUN_ID: "${{ inputs.bridge-run-id }}"
      run: |
        [[ "$BRIDGE_RUN_ID" =~ ^[0-9]+$ ]]
        conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BRIDGE_RUN_ID" --jq .conclusion)"
        test "$conclusion" = success
        bridge_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BRIDGE_RUN_ID" --jq .head_sha)"
        git fetch --depth=1 origin "$bridge_sha"
        git diff --exit-code "$bridge_sha" HEAD -- .   ':(exclude).github/workflows/family-clients.yml'   ':(exclude).github/workflows/family-bridge.yml'
  build-for-macOS:
    name: "${{ matrix.job.target }}"
    runs-on: "${{ matrix.job.os }}"
    needs:
    - verify-bridge
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: aarch64-apple-darwin
          os: macos-15
          extra-build-args: "--screencapturekit"
          extra-cargo-features: ",screencapturekit"
          arch: aarch64
          vcpkg-triplet: arm64-osx
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install build runtime
      run: |
        brew install llvm create-dmg
        # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
        if command -v pkg-config &>/dev/null; then
            echo "pkg-config is already installed"
        else
            brew install pkg-config
        fi
    - name: Install NASM
      run: |
        # Install NASM 2.16.x from official release.
        # Do NOT use `brew install nasm` which installs NASM 3.x.
        # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
        # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
        wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
        unzip nasm-2.16.03-macosx.zip
        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
        nasm --version
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: "${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION
          || env.FLUTTER_VERSION }}"
    - name: Keep CocoaPods for Flutter 3.44 (arm64)
      if: "${{ matrix.job.arch == 'aarch64' }}"
      run: flutter config --no-enable-swift-package-manager
    - name: Patch flutter
      if: "${{ matrix.job.arch == 'x86_64' }}"
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Workaround for flutter issue
      shell: bash
      run: |
        cd "$(dirname "$(which flutter)")"
        # https://github.com/flutter/flutter/issues/133533
        sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
        grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart
    - name: Patch RustDesk sources for Flutter 3.44 (arm64)
      if: "${{ matrix.job.arch == 'aarch64' }}"
      shell: bash
      run: |
        brew install gnu-sed
        export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
        bash .github/patches/apply_flutter_3.44_source_patches.sh
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: "${{ env.MAC_RUST_VERSION }}"
        targets: "${{ matrix.job.target }}"
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: "${{ matrix.job.os }}"
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: "${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44'
          || 'bridge-artifact' }}"
        path: "./"
        run-id: "${{ inputs.bridge-run-id }}"
        github-token: "${{ github.token }}"
    - name: Run the Dart tests
      if: "${{ !inputs.upload-artifact }}"
      working-directory: flutter
      run: flutter test --timeout 60s
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}"
        doNotCache: false
    - name: Install vcpkg dependencies
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
    - name: Show version information (Rust, cargo, Clang)
      shell: bash
      run: |
        clang --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V
    - name: Build rustdesk
      run: |
        if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
        fi
        ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}
    - name: Test verified updates
      if: env.PUBLISH_UPDATE_METADATA == 'true'
      run: |
        python3 -m unittest res/update/test_macos_update_scripts.py
        cargo test --locked --release --lib platform::macos::update_tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"
        cargo test --locked --release --lib verified_dmg_tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"
        cargo test --locked --release --lib update_metadata::tests --features "flutter,hwcodec,unix-file-copy-paste${{ matrix.job.extra-cargo-features }}"
    - name: Run the Rust tests
      if: "${{ !inputs.upload-artifact && matrix.job.arch == 'aarch64' }}"
      run: |
        # The build's own features, so the tests see the code that ships. MACOSX_DEPLOYMENT_TARGET
        # comes from the build step's export.
        FEATURES=$(./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }} --print-features)
        cargo test --locked --release --lib --features "$FEATURES"
        # Opt-in, and its macOS tests run nowhere else.
        cargo test --locked --release -p clipboard --features unix-file-copy-paste
    - name: create unsigned dmg
      if: env.UPLOAD_ARTIFACT == 'true'
      run: |
        CREATE_DMG="$(command -v create-dmg)"
        CREATE_DMG="$(readlink -f "$CREATE_DMG")"
        sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
        create-dmg --icon "RustDesk.app" 200 190 --hide-extension "RustDesk.app" --window-size 800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/RustDesk.app
    - name: Upload unsigned macOS app
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-macos-${{ matrix.job.arch }}
        path: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
    timeout-minutes: 120
  build-rustdesk-android:
    needs:
    - verify-bridge
    name: build rustdesk android apk ${{ matrix.job.target }}
    runs-on: "${{ matrix.job.os }}"
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
             clang \
             cmake \
             curl \
             gcc-multilib \
             git \
             g++ \
             g++-multilib \
             libayatana-appindicator3-dev \
             libasound2-dev \
             libc6-dev \
             libclang-dev \
             libunwind-dev \
             libgstreamer1.0-dev \
             libgstreamer-plugins-base1.0-dev \
             libgtk-3-dev \
             libpulse-dev \
             libva-dev \
             libxcb-randr0-dev \
             libxcb-shape0-dev \
             libxcb-xfixes0-dev \
             libxdo-dev \
             libxfixes-dev \
             llvm-dev \
             nasm \
             ninja-build \
             openjdk-17-jdk-headless \
             pkg-config \
             tree \
             wget
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: "${{ env.ANDROID_FLUTTER_VERSION }}"
    - name: Patch flutter
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with:
        ndk-version: "${{ env.NDK_VERSION }}"
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: "/opt/artifacts/vcpkg"
        vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}"
        doNotCache: false
    - name: Install vcpkg dependencies
      run: |
        case ${{ matrix.job.target }} in
          aarch64-linux-android)
            ANDROID_TARGET=arm64-v8a
          ;;
          armv7-linux-androideabi)
            ANDROID_TARGET=armeabi-v7a
          ;;
          x86_64-linux-android)
            ANDROID_TARGET=x86_64
          ;;
          i686-linux-android)
            ANDROID_TARGET=x86
          ;;
        esac
        if ! ./flutter/build_android_deps.sh "${ANDROID_TARGET}"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
      shell: bash
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: "./"
        run-id: "${{ inputs.bridge-run-id }}"
        github-token: "${{ github.token }}"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: "${{ env.RUST_VERSION }}"
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-android
        key: "${{ matrix.job.target }}"
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: "${{ steps.setup-ndk.outputs.ndk-path }}"
        ANDROID_NDK_ROOT: "${{ steps.setup-ndk.outputs.ndk-path }}"
      run: |
        rustup target add ${{ matrix.job.target }}
        cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
        case ${{ matrix.job.target }} in
          aarch64-linux-android)
            ./flutter/ndk_arm64.sh
            mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          ;;
          armv7-linux-androideabi)
            ./flutter/ndk_arm.sh
            mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
          ;;
          x86_64-linux-android)
            ./flutter/ndk_x64.sh
            mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
          ;;
          i686-linux-android)
            ./flutter/ndk_x86.sh
            mkdir -p ./flutter/android/app/src/main/jniLibs/x86
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so
          ;;
        esac
    - name: Upload Rustdesk library to Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: librustdesk.so.${{ matrix.job.target }}
        path: "./target/${{ matrix.job.target }}/release/liblibrustdesk.so"
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
      run: |
        export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
        # Increase Gradle JVM memory for CI builds
        sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
        # temporary use debug sign config
        sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
        case ${{ matrix.job.target }} in
          aarch64-linux-android)
            mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
            cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
            # build flutter
            pushd flutter
            flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm64 --split-per-abi
            mv build/app/outputs/flutter-apk/app-arm64-v8a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          ;;
          armv7-linux-androideabi)
            mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a
            cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
            # build flutter
            pushd flutter
            flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-arm --split-per-abi
            mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          ;;
          x86_64-linux-android)
            mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64
            cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so
            # build flutter
            pushd flutter
            flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x64 --split-per-abi
            mv build/app/outputs/flutter-apk/app-x86_64-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          ;;
          i686-linux-android)
            mkdir -p ./flutter/android/app/src/main/jniLibs/x86
            cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/
            cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so
            # build flutter
            pushd flutter
            flutter build apk "--${{ matrix.job.reltype }}" --target-platform android-x86 --split-per-abi
            mv build/app/outputs/flutter-apk/app-x86-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk
          ;;
        esac
        popd
        mkdir -p signed-apk; pushd signed-apk
        mv ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk .
    - name: Upload Android baseline APK
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: family-android-arm64-baseline
        path: signed-apk/*.apk
        if-no-files-found: error
        retention-days: 7
    timeout-minutes: 120
  build-rustdesk-ios:
    name: build rustdesk ios ipa
    runs-on: "${{ matrix.job.os }}"
    needs:
    - verify-bridge
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-apple-ios
          os: macos-latest
          vcpkg-triplet: arm64-ios
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
    - name: Install dependencies
      run: 'brew install nasm yasm

        '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: "${{ env.FLUTTER_VERSION }}"
    - name: Patch flutter
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}"
        doNotCache: false
    - name: Install vcpkg dependencies
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: "${{ env.RUST_VERSION }}"
        targets: "${{ matrix.job.target }}"
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-ios
        key: "${{ matrix.job.target }}"
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: "./"
        run-id: "${{ inputs.bridge-run-id }}"
        github-token: "${{ github.token }}"
    - name: Build rustdesk lib
      run: |
        rustup target add ${{ matrix.job.target }}
        cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios --lib
    - name: Upload liblibrustdesk.a Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: liblibrustdesk.a
        path: target/aarch64-apple-ios/release/liblibrustdesk.a
    - name: Build rustdesk
      shell: bash
      run: |
        pushd flutter
        # flutter build ipa --release --obfuscate --split-debug-info=./split-debug-info --no-codesign
        # for easy debugging
        flutter build ipa --release --no-codesign
    - name: Package unsigned iPad archive
      run: |
        archive_path="$(find flutter/build/ios/archive -maxdepth 1 -type d -name '*.xcarchive' -print -quit)"
        test -n "$archive_path"
        ditto -c -k --sequesterRsrc --keepParent "$archive_path" family-ipad-unsigned.xcarchive.zip
    - name: Upload unsigned iPad archive
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: family-ipad-unsigned-baseline
        path: family-ipad-unsigned.xcarchive.zip
        if-no-files-found: error
        retention-days: 7
    timeout-minutes: 120
